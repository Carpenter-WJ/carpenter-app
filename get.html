<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현장일지 시작하기</title>
<style>
  body { margin:0; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:linear-gradient(160deg,#E2630E,#9E3300); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
  .card { text-align:center; color:#fff; max-width:360px; }
  .logo { width:88px; height:88px; border-radius:22px; margin:0 auto 20px; display:block; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  h1 { font-size:20px; margin:0 0 8px; }
  p { font-size:14px; opacity:.85; line-height:1.6; margin:0 0 28px; }
  .spinner { width:28px; height:28px; border:3px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; margin:0 auto 28px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .links { display:flex; flex-direction:column; gap:10px; }
  a.btn { display:block; padding:13px; border-radius:12px; text-decoration:none; font-size:14px; font-weight:700; }
  a.btn.pri { background:#fff; color:#D35400; }
  a.btn.out { background:rgba(255,255,255,.12); color:#fff; border:1.5px solid rgba(255,255,255,.5); }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="icon.svg" alt="현장일지" onerror="this.style.display='none'">
  <h1>현장일지로 이동 중이에요</h1>
  <div class="spinner"></div>
  <p>자동으로 이동하지 않으면 아래 버튼을 눌러주세요.</p>
  <div class="links">
    <a class="btn pri" href="https://apps.apple.com/app/id6791999893">iOS 앱스토어에서 열기</a>
    <a class="btn out" href="https://play.google.com/store/apps/details?id=com.hyunjangilji.app">Android 플레이스토어에서 열기</a>
    <a class="btn out" href="index.html">웹으로 이용하기</a>
  </div>
</div>
<script>
  var ua = navigator.userAgent || '';
  var target = null;
  if (/Android/i.test(ua)) {
    target = 'https://play.google.com/store/apps/details?id=com.hyunjangilji.app';
  } else if (/iPhone|iPad|iPod/i.test(ua)) {
    target = 'https://apps.apple.com/app/id6791999893';
  } else {
    target = 'index.html';
  }
  location.replace(target);
</script>
</body>
</html>
